<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>دليل تواصل الهيئة التعليمية - مدرسة الحد الابتدائية الإعدادية للبنين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#14213d;--muted:#5b6678;--line:#dde3ec;--bg:#f4f6fa;--card:#fff;--red:#a3182f;--wa:#1fa855;--wa-dark:#168a45}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
  header{background:var(--ink);color:#fff;padding:28px 20px 64px}
  .wrap{max-width:680px;margin:0 auto}
  header h1{margin:0;font-size:1.6rem;font-weight:800;line-height:1.35}
  header p{margin:6px 0 0;color:#c4cde0}
  .stripe{height:6px;width:64px;background:var(--red);border-radius:3px;margin-bottom:14px}
  main{margin-top:-36px;padding:0 16px 40px}
  .box{background:var(--card);border-radius:14px;box-shadow:0 6px 24px rgba(20,33,61,.14);padding:6px 16px;display:flex;align-items:center;gap:10px}
  .box input{flex:1;border:0;outline:0;font:inherit;font-size:1.15rem;padding:14px 0;background:transparent;color:var(--ink);min-width:0}
  .box:focus-within{outline:3px solid var(--red);outline-offset:2px}
  .box svg{flex:none;color:var(--muted)}
  .go{border:0;background:var(--red);color:#fff;font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer}
  .msg{margin:12px 4px;color:var(--muted);font-size:.95rem}
  .err{color:var(--red);font-weight:700}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:.9rem;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .info{flex:1 1 220px;min-width:0}
  .name{font-weight:700;font-size:1.1rem}
  .sub{color:var(--muted);font-size:.8rem}
  .num{direction:ltr;unicode-bidi:embed;text-align:right;font-weight:500;font-size:1.05rem;margin-top:2px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;font:inherit;font-weight:700;font-size:.95rem;text-decoration:none;border:0;cursor:pointer}
  .btn:focus-visible,.go:focus-visible,.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .wa{background:var(--wa);color:#fff}.wa:hover{background:var(--wa-dark)}
  .call{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  .empty{display:block;text-align:center;color:var(--muted);border-style:dashed}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 28px}
  [hidden]{display:none!important}
  @media (max-width:480px){.actions{width:100%}.btn{flex:1;justify-content:center}}
</style>
</head>
<body>
<header><div class="wrap"><div class="stripe"></div>
<h1>مدرسة الحد الابتدائية الإعدادية للبنين</h1>
<p>دليل التواصل مع الهيئة الإدارية والتعليمية</p></div></header>

<main class="wrap">
  <section id="app">
    <label class="box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="اكتب اسم المعلم" autocomplete="off" aria-label="ابحث عن معلم">
    </label>
    <div class="msg" id="count" aria-live="polite"></div>
    <ul id="list"></ul>
  </section>
</main>
<footer>للاستخدام الداخلي للكادر الوظيفي فقط</footer>

function norm(s){
  return (s||"").toString().replace(/[\u064B-\u065F\u0670\u0640]/g,"")
   .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").toLowerCase().trim();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const full=p=>{let d=(p||"").replace(/\D/g,"");return d.length<=8?COUNTRY+d:d;};
const pretty=p=>"+"+COUNTRY+" "+p.slice(-8,-4)+" "+p.slice(-4);

function actions(p){
  const n=full(p);
  return '<a class="btn wa" href="https://wa.me/'+n+'" target="_blank" rel="noopener" aria-label="واتساب '+p+'">واتساب</a>'+
         '<a class="btn call" href="tel:+'+n+'">اتصال</a>';
}
function render(){
  const terms=norm(document.getElementById("q").value).split(/\s+/).filter(Boolean);
  const rows=STAFF.filter(t=>terms.every(w=>norm(t.name).includes(w)));
  document.getElementById("count").textContent=terms.length?("النتائج: "+rows.length):("إجمالي العاملين: "+STAFF.length);
  const list=document.getElementById("list");
  if(!rows.length){list.innerHTML='<li class="empty">لا توجد نتائج. جرّب كتابة جزء من الاسم فقط.</li>';return;}
  list.innerHTML=rows.map(t=>{
    let h='<li><div class="info"><div class="name">'+esc(t.name)+'</div>'+
      '<div class="sub">'+esc(t.section)+(t.note?' - '+esc(t.note):'')+'</div>'+
      '<div class="num">'+esc(pretty(t.phone))+'</div>'+
      (t.phone2?'<div class="num">'+esc(pretty(t.phone2))+'</div>':'')+'</div>'+
      '<div class="actions">'+actions(t.phone)+'</div></li>';
    return h;
  }).join("");
}
document.getElementById("q").addEventListener("input",render);
render();
